x-backend: &backend
  image: notification-backend:local
  build: ./backend
  init: true
  restart: unless-stopped
  stop_grace_period: 90s
  environment:
    PORT: 3000
    DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    ACCESS_TOKEN_SECRET: ${ACCESS_TOKEN_SECRET:?Set ACCESS_TOKEN_SECRET}
    REFRESH_TOKEN_SECRET: ${REFRESH_TOKEN_SECRET:?Set REFRESH_TOKEN_SECRET}
    ACCESS_TOKEN_EXPIRES_IN: ${ACCESS_TOKEN_EXPIRES_IN:-1d}
    REFRESH_TOKEN_EXPIRES_IN: ${REFRESH_TOKEN_EXPIRES_IN:-7d}
    REFRESH_COOKIE_SECURE: ${REFRESH_COOKIE_SECURE:-false}
    REFRESH_COOKIE_SAME_SITE: ${REFRESH_COOKIE_SAME_SITE:-strict}
    REFRESH_COOKIE_NAME: ${REFRESH_COOKIE_NAME:-refreshToken}
    REFRESH_COOKIE_PATH: ${REFRESH_COOKIE_PATH:-/api/v1/auth}
    RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-100}
    RATE_LIMIT_WINDOW_MS: ${RATE_LIMIT_WINDOW_MS:-60000}
    NODE_ENV: ${NODE_ENV:-production}
    CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://localhost:5173}
    REDIS_HOST: redis
    REDIS_PORT: 6379
    DELIVERY_MAX_ATTEMPTS: ${DELIVERY_MAX_ATTEMPTS:-5}
    DELIVERY_BACKOFF_MS: ${DELIVERY_BACKOFF_MS:-1000}
    WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-3}
    DELIVERY_TIMEOUT_MS: ${DELIVERY_TIMEOUT_MS:-10000}
    OUTBOX_POLL_MS: ${OUTBOX_POLL_MS:-1000}
    SOCKET_ORIGINS: ${SOCKET_ORIGINS:-http://localhost:3000,http://localhost:5173}
    SOCKET_CHECK_MS: ${SOCKET_CHECK_MS:-15000}
    PRESENCE_TTL_MS: ${PRESENCE_TTL_MS:-60000}
    REALTIME_PREFIX: ${REALTIME_PREFIX:-notification-service:realtime}
    RESEND_API_KEY: ${RESEND_API_KEY:-}
    EMAIL_FROM: ${EMAIL_FROM:-}
    VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
    VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
    VAPID_SUBJECT: ${VAPID_SUBJECT:-}
    REMINDERS_ENABLED: ${REMINDERS_ENABLED:-true}
    REMINDER_FIRST_MS: ${REMINDER_FIRST_MS:-1800000}
    REMINDER_SECOND_MS: ${REMINDER_SECOND_MS:-86400000}
    REMINDER_MAX_COUNT: ${REMINDER_MAX_COUNT:-2}
    REMINDER_TYPES: ${REMINDER_TYPES:-SYSTEM,SECURITY}
    SCHEDULE_RECHECK_MS: ${SCHEDULE_RECHECK_MS:-60000}
    SHUTDOWN_TIMEOUT_MS: ${SHUTDOWN_TIMEOUT_MS:-75000}

services:
  nginx:
    build: ./infra/nginx
    restart: unless-stopped
    ports: ["${PORT:-8000}:8080"]
    depends_on:
      backend: {condition: service_healthy}

  backend:
    <<: *backend
    command: ["node", "src/server.js"]
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 10

  worker:
    <<: *backend
    command: ["node", "src/workers/notification-worker.js"]
    depends_on:
      backend: {condition: service_healthy}

  outbox:
    <<: *backend
    command: ["node", "src/workers/outbox.js"]
    depends_on:
      backend: {condition: service_healthy}

  migrate:
    <<: *backend
    restart: "no"
    command: ["node", "src/database/migrate.js"]
    depends_on:
      postgres: {condition: service_healthy}

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes: ["monolith_postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "${REDIS_MAXMEMORY:-256mb}", "--maxmemory-policy", "noeviction"]
    volumes: ["monolith_redis_data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  monolith_postgres_data:
  monolith_redis_data:
