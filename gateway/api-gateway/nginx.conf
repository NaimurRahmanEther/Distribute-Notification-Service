worker_processes auto;
worker_shutdown_timeout 75s;
events { worker_connections 1024; }
http {
  resolver 127.0.0.11 valid=5s ipv6=off;
  map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
  }
  log_format gateway escape=json '{"event":"gateway.request","instance":"$hostname","requestId":"$http_x_request_id","method":"$request_method","status":$status,"upstream":"$upstream_addr","duration":$request_time}';
  access_log /dev/stdout gateway;
  error_log /dev/stderr warn;
  server_tokens off;
  client_max_body_size 100k;

  upstream auth_api {
    zone auth_api 64k;
    server auth-service:3001 resolve;
    keepalive 32;
  }
  upstream gateway_access {
    zone gateway_access 64k;
    server gateway-access:3003 resolve;
    keepalive 32;
  }
  upstream notification_api {
    zone notification_api 64k;
    server notification-service:3002 resolve;
    keepalive 32;
  }
  server {
    listen 8080;
    # Route policy: IP limits first, then Auth session validation before forwarding.
    auth_request /_gateway_access;
    auth_request_set $gateway_status $upstream_http_x_gateway_status;
    auth_request_set $gateway_identity $upstream_http_x_gateway_identity;
    auth_request_set $gateway_limit $upstream_http_ratelimit_limit;
    auth_request_set $gateway_remaining $upstream_http_ratelimit_remaining;
    auth_request_set $gateway_reset $upstream_http_ratelimit_reset;
    auth_request_set $gateway_retry_after $upstream_http_retry_after;
    auth_request_set $gateway_cors_origin $upstream_http_access_control_allow_origin;
    auth_request_set $gateway_cors_credentials $upstream_http_access_control_allow_credentials;
    add_header Gateway-RateLimit-Limit $gateway_limit always;
    add_header Gateway-RateLimit-Remaining $gateway_remaining always;
    add_header Gateway-RateLimit-Reset $gateway_reset always;
    # These are access-subrequest failures, not proxied Auth API responses.
    proxy_intercept_errors off;
    error_page 401 403 500 = @gateway_denied;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_set_header X-Request-Id $http_x_request_id;
    proxy_set_header X-Service-Token "";
    proxy_set_header X-Gateway-Identity $gateway_identity;
    proxy_set_header Connection "";
    proxy_connect_timeout 3s;
    proxy_read_timeout 80s;
    proxy_send_timeout 80s;
    # Nginx does not replay sent POST/PATCH requests: never enable non_idempotent.
    proxy_next_upstream error timeout http_502 http_503 http_504;
    proxy_next_upstream_tries 2;

    location = /health/live { auth_request off; default_type application/json; return 200 '{"status":"alive"}'; }
    location = /health { auth_request off; proxy_pass http://notification_api; }
    location = /health/ready { auth_request /_gateway_readiness; proxy_pass http://notification_api; }
    location = /_gateway_access {
      internal;
      auth_request off;
      proxy_pass http://gateway_access/check;
      proxy_method GET;
      proxy_pass_request_body off;
      proxy_pass_request_headers off;
      proxy_set_header Content-Length "";
      proxy_set_header X-Client-IP $http_x_forwarded_for;
      proxy_set_header X-Original-Method $request_method;
      proxy_set_header X-Original-Path $gateway_path;
      proxy_set_header X-Original-URI $request_uri;
      proxy_set_header Authorization $http_authorization;
      proxy_set_header Cookie $http_cookie;
      proxy_set_header X-Request-Id $http_x_request_id;
      proxy_set_header Origin $http_origin;
      proxy_connect_timeout 1s;
      proxy_read_timeout 12s;
      proxy_next_upstream off;
    }
    location = /_gateway_readiness {
      internal;
      auth_request off;
      proxy_pass http://gateway_access/ready;
      proxy_pass_request_body off;
      proxy_set_header Content-Length "";
      proxy_connect_timeout 1s;
      proxy_read_timeout 12s;
      proxy_next_upstream off;
    }
    location @gateway_denied {
      auth_request off;
      default_type application/json;
      add_header Retry-After $gateway_retry_after always;
      add_header Gateway-RateLimit-Limit $gateway_limit always;
      add_header Gateway-RateLimit-Remaining $gateway_remaining always;
      add_header Gateway-RateLimit-Reset $gateway_reset always;
      add_header Access-Control-Allow-Origin $gateway_cors_origin always;
      add_header Access-Control-Allow-Credentials $gateway_cors_credentials always;
      add_header Access-Control-Expose-Headers "Retry-After, Gateway-RateLimit-Limit, Gateway-RateLimit-Remaining, Gateway-RateLimit-Reset" always;
      add_header Vary Origin always;
      add_header Cache-Control no-store always;
      if ($gateway_status = "429") { return 429 '{"success":false,"message":"Too many requests. Please try again later."}'; }
      if ($gateway_status = "401") { return 401 '{"success":false,"message":"A valid access token is required"}'; }
      if ($gateway_status = "403") { return 403 '{"success":false,"message":"Admin access required"}'; }
      if ($gateway_status = "404") { return 404 '{"success":false,"message":"Route not found"}'; }
      return 503 '{"success":false,"message":"Gateway authentication or rate limiter unavailable. Please try again later."}';
    }
    location /api/v1/auth/ {
      set $gateway_path $uri;
      proxy_pass http://auth_api;
    }
    location ~ ^/api/v1/(notifications|notification-deliveries|notification-preferences|push-subscriptions)(/|$) {
      set $gateway_path $uri;
      proxy_pass http://notification_api;
    }
    location ~ ^/api/v1/admin/(dead-letters|operations)(/|$) {
      set $gateway_path $uri;
      proxy_pass http://notification_api;
    }
    location /socket.io/ {
      set $gateway_path $uri;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
      proxy_set_header X-Request-Id $http_x_request_id;
      proxy_set_header X-Service-Token "";
      proxy_set_header X-Gateway-Identity $gateway_identity;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_read_timeout 75s;
      proxy_pass http://notification_api;
    }
    # In particular, /internal is never forwarded to either service.
    location / { default_type application/json; return 404 '{"success":false,"message":"Route not found"}'; }
  }
}
