worker_processes auto;
worker_shutdown_timeout 75s;
events { worker_connections 1024; }
http {
  resolver 127.0.0.11 valid=5s ipv6=off;
  map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
  }
  log_format edge escape=json '{"event":"edge.request","requestId":"$request_id","method":"$request_method","status":$status,"upstream":"$upstream_addr","duration":$request_time}';
  access_log /dev/stdout edge;
  error_log /dev/stderr warn;
  server_tokens off;
  client_max_body_size 100k;
  upstream gateways {
    zone gateways 64k;
    least_conn;
    server api-gateway:8080 resolve max_fails=2 fail_timeout=5s;
    keepalive 32;
  }
  server {
    listen 8080;
    location / {
      proxy_pass http://gateways;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      # Replace client-supplied identity/forwarding headers at the public edge.
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Request-Id $request_id;
      proxy_set_header X-Service-Token "";
      proxy_set_header X-Gateway-Identity "";
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_connect_timeout 3s;
      proxy_read_timeout 90s;
      proxy_send_timeout 90s;
      proxy_next_upstream error timeout http_502 http_503 http_504;
      proxy_next_upstream_tries 2;
    }
  }
}
